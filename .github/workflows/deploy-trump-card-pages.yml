name: Deploy trump-card-app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/trump-card-app-5y580x
    paths:
      - "trump-card-app/**"
      - ".github/workflows/deploy-trump-card-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload trump-card-app as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: trump-card-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
